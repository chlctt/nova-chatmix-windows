ShortDescription: ChatMix wheel, per-app output routing and channel mixer for the SteelSeries Arctis Nova Pro Wireless, without GG/Sonar.
Description: |-
  Unofficial Windows tool for the Arctis Nova Pro Wireless base station. The ChatMix wheel mixes game and chat apps per app,
  every app can be assigned to a channel (Game, Chat, Media, Aux) with its own output device, and the default microphone
  can be selected. Requires NirSoft SoundVolumeView. Not affiliated with SteelSeries.
